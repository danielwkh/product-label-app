<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="theme-color" content="#0f766e" />
  <title>商品標籤助手 · Label Finder</title>
  <link rel="manifest" href="manifest.json" />
  <script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/fuse.js@7.0.0/dist/fuse.min.js"></script>
  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
  <style>
    :root {
      --primary: #0f766e;
      --primary-dark: #0d5c56;
      --bg: #f0fdfa;
      --card: #ffffff;
      --text: #134e4a;
      --muted: #5eead4;
      --danger: #dc2626;
      --border: #99f6e4;
      --radius: 14px;
      --shadow: 0 4px 20px rgba(15, 118, 110, 0.12);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang TC", "Microsoft JhengHei", sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100dvh;
      padding-bottom: 80px;
      line-height: 1.5;
    }
    header {
      background: linear-gradient(135deg, var(--primary), #0d9488);
      color: white;
      padding: 16px 20px 20px;
      position: sticky;
      top: 0;
      z-index: 50;
      box-shadow: var(--shadow);
    }
    header h1 {
      font-size: 1.25rem;
      font-weight: 700;
      letter-spacing: -0.02em;
    }
    header p {
      font-size: 0.8rem;
      opacity: 0.85;
      margin-top: 2px;
    }
    .tabs {
      display: flex;
      background: white;
      border-bottom: 1px solid var(--border);
      position: sticky;
      top: 72px;
      z-index: 40;
    }
    .tab {
      flex: 1;
      text-align: center;
      padding: 14px 8px;
      font-size: 0.95rem;
      font-weight: 600;
      color: #64748b;
      background: none;
      border: none;
      border-bottom: 3px solid transparent;
      cursor: pointer;
      transition: all 0.2s;
    }
    .tab.active {
      color: var(--primary);
      border-bottom-color: var(--primary);
      background: #f0fdfa;
    }
    .panel {
      display: none;
      padding: 16px;
      max-width: 640px;
      margin: 0 auto;
    }
    .panel.active { display: block; }
    .card {
      background: var(--card);
      border-radius: var(--radius);
      padding: 18px;
      margin-bottom: 16px;
      box-shadow: var(--shadow);
      border: 1px solid var(--border);
    }
    .card h2 {
      font-size: 1.05rem;
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .card h2 span { font-size: 1.3rem; }
    label.file-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      background: var(--primary);
      color: white;
      padding: 14px 18px;
      border-radius: 12px;
      font-weight: 600;
      font-size: 0.95rem;
      cursor: pointer;
      transition: background 0.2s;
      width: 100%;
      border: none;
    }
    label.file-btn:active { background: var(--primary-dark); }
    input[type="file"] { display: none; }
    .status {
      margin-top: 12px;
      font-size: 0.85rem;
      padding: 10px 12px;
      border-radius: 10px;
      background: #ecfdf5;
      color: #065f46;
      display: none;
    }
    .status.show { display: block; }
    .status.warn { background: #fef3c7; color: #92400e; }
    .status.error { background: #fee2e2; color: #991b1b; }
    .stats {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-top: 12px;
    }
    .stat {
      background: #f0fdfa;
      border-radius: 10px;
      padding: 12px;
      text-align: center;
    }
    .stat .num {
      font-size: 1.5rem;
      font-weight: 700;
      color: var(--primary);
    }
    .stat .label { font-size: 0.75rem; color: #64748b; margin-top: 2px; }
    .search-box {
      display: flex;
      gap: 8px;
      margin-bottom: 14px;
    }
    .search-box input {
      flex: 1;
      padding: 14px 16px;
      border: 2px solid var(--border);
      border-radius: 12px;
      font-size: 1rem;
      outline: none;
      background: white;
    }
    .search-box input:focus { border-color: var(--primary); }
    .btn {
      padding: 14px 16px;
      border-radius: 12px;
      border: none;
      font-weight: 600;
      font-size: 0.95rem;
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.15s;
    }
    .btn-primary {
      background: var(--primary);
      color: white;
    }
    .btn-primary:active { background: var(--primary-dark); }
    .btn-outline {
      background: white;
      color: var(--primary);
      border: 2px solid var(--primary);
    }
    .btn-scan {
      background: #0d9488;
      color: white;
      width: 100%;
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }
    #reader {
      width: 100%;
      max-width: 400px;
      margin: 0 auto 16px;
      border-radius: 12px;
      overflow: hidden;
      display: none;
    }
    #reader.show { display: block; }
    .result-card {
      background: white;
      border-radius: var(--radius);
      padding: 16px;
      margin-bottom: 12px;
      border: 1px solid var(--border);
      box-shadow: var(--shadow);
    }
    .result-card .name {
      font-size: 1.1rem;
      font-weight: 700;
      margin-bottom: 6px;
    }
    .result-card .meta {
      font-size: 0.85rem;
      color: #64748b;
      margin-bottom: 12px;
    }
    .result-card .meta span {
      display: inline-block;
      background: #f0fdfa;
      padding: 2px 8px;
      border-radius: 6px;
      margin-right: 6px;
      margin-bottom: 4px;
    }
    .result-actions {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }
    .result-actions .btn { flex: 1; min-width: 120px; }
    .empty {
      text-align: center;
      padding: 40px 20px;
      color: #94a3b8;
    }
    .empty .icon { font-size: 3rem; margin-bottom: 12px; }
    .match-list {
      max-height: 200px;
      overflow-y: auto;
      margin-top: 10px;
      font-size: 0.85rem;
    }
    .match-item {
      padding: 8px 10px;
      border-bottom: 1px solid #e2e8f0;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .match-item:last-child { border-bottom: none; }
    .score {
      font-size: 0.75rem;
      background: #ccfbf1;
      color: #0f766e;
      padding: 2px 6px;
      border-radius: 6px;
    }
    .footer-note {
      text-align: center;
      font-size: 0.75rem;
      color: #94a3b8;
      padding: 20px 16px;
    }
    .danger-btn {
      background: #fef2f2;
      color: var(--danger);
      border: 1px solid #fecaca;
      width: 100%;
      margin-top: 12px;
    }
    #toast {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%) translateY(100px);
      background: #134e4a;
      color: white;
      padding: 12px 20px;
      border-radius: 12px;
      font-size: 0.9rem;
      z-index: 100;
      transition: transform 0.3s ease;
      max-width: 90%;
      text-align: center;
    }
    #toast.show { transform: translateX(-50%) translateY(0); }
  </style>
</head>
<body>
  <header>
    <h1>🏷️ 商品標籤助手</h1>
    <p>上傳資料 → 掃碼 / 搜尋 → 分享到 WePrint</p>
  </header>

  <div class="tabs">
    <button class="tab active" data-tab="upload">上傳資料</button>
    <button class="tab" data-tab="search">搜尋 / 掃碼</button>
  </div>

  <!-- Upload Panel -->
  <div id="panel-upload" class="panel active">
    <div class="card">
      <h2><span>📊</span> 商品資料庫 (Excel)</h2>
      <p style="font-size:0.85rem;color:#64748b;margin-bottom:12px;">
        需要包含「名稱」、「條碼」、「第二條碼」欄位
      </p>
      <label class="file-btn">
        選擇 Excel 檔案
        <input type="file" id="excelInput" accept=".xlsx,.xls,.csv" />
      </label>
      <div id="excelStatus" class="status"></div>
    </div>

    <div class="card">
      <h2><span>📄</span> 營養標籤 PDF</h2>
      <p style="font-size:0.85rem;color:#64748b;margin-bottom:12px;">
        可一次選多個 PDF，檔名需包含商品中文名稱（會做模糊比對）
      </p>
      <label class="file-btn">
        選擇多個 PDF 檔案
        <input type="file" id="pdfInput" accept=".pdf" multiple />
      </label>
      <div id="pdfStatus" class="status"></div>
      <div id="matchPreview" class="match-list" style="display:none;"></div>
    </div>

    <div class="card">
      <h2><span>📈</span> 目前資料統計</h2>
      <div class="stats">
        <div class="stat">
          <div class="num" id="statProducts">0</div>
          <div class="label">商品數量</div>
        </div>
        <div class="stat">
          <div class="num" id="statLabels">0</div>
          <div class="label">已配對標籤</div>
        </div>
      </div>
      <button class="btn danger-btn" id="clearDataBtn">清除所有本地資料</button>
    </div>
  </div>

  <!-- Search Panel -->
  <div id="panel-search" class="panel">
    <div class="card">
      <h2><span>🔍</span> 搜尋商品</h2>
      <button class="btn btn-scan" id="scanBtn">📷 開啟相機掃描條碼</button>
      <div id="reader"></div>
      <div class="search-box">
        <input type="text" id="barcodeInput" placeholder="輸入條碼或商品名稱..." inputmode="search" />
        <button class="btn btn-primary" id="searchBtn">搜尋</button>
      </div>
      <div id="searchResults"></div>
    </div>
  </div>

  <div class="footer-note">
    資料只存在本機瀏覽器 · 可加入主畫面當成 App 使用
  </div>

  <div id="toast"></div>

  <script>
    // ========== State ==========
    let products = [];          // { name, barcode, barcode2, labelId? }
    let labels = {};            // id -> { filename, nameFromFile, blob, matchedProductName? }
    let fuse = null;
    let html5QrCode = null;
    let isScanning = false;

    const DB_NAME = 'ProductLabelDB';
    const DB_VERSION = 1;

    // ========== IndexedDB ==========
    function openDB() {
      return new Promise((resolve, reject) => {
        const req = indexedDB.open(DB_NAME, DB_VERSION);
        req.onupgradeneeded = (e) => {
          const db = e.target.result;
          if (!db.objectStoreNames.contains('products')) {
            db.createObjectStore('products', { keyPath: 'id', autoIncrement: true });
          }
          if (!db.objectStoreNames.contains('labels')) {
            db.createObjectStore('labels', { keyPath: 'id' });
          }
          if (!db.objectStoreNames.contains('meta')) {
            db.createObjectStore('meta', { keyPath: 'key' });
          }
        };
        req.onsuccess = () => resolve(req.result);
        req.onerror = () => reject(req.error);
      });
    }

    async function saveProducts(list) {
      const db = await openDB();
      const tx = db.transaction('products', 'readwrite');
      const store = tx.objectStore('products');
      await store.clear();
      for (const p of list) {
        store.put(p);
      }
      return new Promise((res, rej) => {
        tx.oncomplete = res;
        tx.onerror = () => rej(tx.error);
      });
    }

    async function loadProducts() {
      const db = await openDB();
      return new Promise((resolve, reject) => {
        const tx = db.transaction('products', 'readonly');
        const req = tx.objectStore('products').getAll();
        req.onsuccess = () => resolve(req.result || []);
        req.onerror = () => reject(req.error);
      });
    }

    async function saveLabel(id, data) {
      const db = await openDB();
      const tx = db.transaction('labels', 'readwrite');
      tx.objectStore('labels').put({ id, ...data });
      return new Promise((res, rej) => {
        tx.oncomplete = res;
        tx.onerror = () => rej(tx.error);
      });
    }

    async function loadAllLabels() {
      const db = await openDB();
      return new Promise((resolve, reject) => {
        const tx = db.transaction('labels', 'readonly');
        const req = tx.objectStore('labels').getAll();
        req.onsuccess = () => {
          const list = req.result || [];
          const map = {};
          list.forEach(l => { map[l.id] = l; });
          resolve(map);
        };
        req.onerror = () => reject(req.error);
      });
    }

    async function clearAllData() {
      const db = await openDB();
      const tx = db.transaction(['products', 'labels'], 'readwrite');
      tx.objectStore('products').clear();
      tx.objectStore('labels').clear();
      return new Promise((res, rej) => {
        tx.oncomplete = res;
        tx.onerror = () => rej(tx.error);
      });
    }

    // ========== Helpers ==========
    function toast(msg, duration = 2500) {
      const el = document.getElementById('toast');
      el.textContent = msg;
      el.classList.add('show');
      setTimeout(() => el.classList.remove('show'), duration);
    }

    function showStatus(id, msg, type = '') {
      const el = document.getElementById(id);
      el.textContent = msg;
      el.className = 'status show' + (type ? ' ' + type : '');
    }

    function cleanName(str) {
      if (!str) return '';
      return String(str)
        .replace(/\.pdf$/i, '')
        .replace(/[_\-\s]+/g, ' ')
        .replace(/[（(].*?[）)]/g, '')
        .trim()
        .toLowerCase();
    }

    function updateStats() {
      document.getElementById('statProducts').textContent = products.length;
      const matched = products.filter(p => p.labelId).length;
      document.getElementById('statLabels').textContent = matched;
    }

    function rebuildFuse() {
      if (products.length === 0) {
        fuse = null;
        return;
      }
      fuse = new Fuse(products, {
        keys: [
          { name: 'name', weight: 0.6 },
          { name: 'barcode', weight: 0.3 },
          { name: 'barcode2', weight: 0.3 }
        ],
        threshold: 0.4,
        includeScore: true,
        ignoreLocation: true
      });
    }

    // ========== Excel Upload ==========
    document.getElementById('excelInput').addEventListener('change', async (e) => {
      const file = e.target.files[0];
      if (!file) return;

      showStatus('excelStatus', '讀取中...', '');
      try {
        const data = await file.arrayBuffer();
        const wb = XLSX.read(data, { type: 'array' });
        const sheet = wb.Sheets[wb.SheetNames[0]];
        const rows = XLSX.utils.sheet_to_json(sheet, { defval: '' });

        if (rows.length === 0) {
          showStatus('excelStatus', 'Excel 沒有資料', 'error');
          return;
        }

        // Find columns (flexible matching)
        const headers = Object.keys(rows[0]);
        const findCol = (candidates) => {
          for (const c of candidates) {
            const found = headers.find(h => h.toLowerCase().includes(c.toLowerCase()) || c.toLowerCase().includes(h.toLowerCase()));
            if (found) return found;
          }
          return null;
        };

        const nameCol = findCol(['名稱', '商品名稱', '品名', 'name', 'product']);
        const barcodeCol = findCol(['條碼', 'barcode', 'bar code', '主條碼']);
        const barcode2Col = findCol(['第二條碼', '副條碼', 'barcode2', 'second', 'barcode 2']);

        if (!nameCol) {
          showStatus('excelStatus', '找不到「名稱」欄位，請檢查 Excel', 'error');
          return;
        }

        products = rows.map((row, idx) => ({
          id: idx + 1,
          name: String(row[nameCol] || '').trim(),
          barcode: String(row[barcodeCol] || '').trim(),
          barcode2: String(row[barcode2Col] || '').trim(),
          labelId: null
        })).filter(p => p.name);

        // Try re-match existing labels
        await rematchLabels();

        await saveProducts(products);
        rebuildFuse();
        updateStats();

        showStatus('excelStatus', `成功載入 ${products.length} 個商品（名稱欄：${nameCol}${barcodeCol ? '，條碼：' + barcodeCol : ''}${barcode2Col ? '，第二條碼：' + barcode2Col : ''}）`);
        toast('Excel 上傳成功');
      } catch (err) {
        console.error(err);
        showStatus('excelStatus', '讀取失敗：' + err.message, 'error');
      }
      e.target.value = '';
    });

    // ========== PDF Upload ==========
    document.getElementById('pdfInput').addEventListener('change', async (e) => {
      const files = Array.from(e.target.files);
      if (files.length === 0) return;

      showStatus('pdfStatus', `處理 ${files.length} 個 PDF 中...`);
      let added = 0;
      let matchedCount = 0;
      const preview = [];

      for (const file of files) {
        if (!file.name.toLowerCase().endsWith('.pdf')) continue;

        const id = 'label_' + Date.now() + '_' + Math.random().toString(36).slice(2, 8);
        const nameFromFile = file.name.replace(/\.pdf$/i, '');
        const blob = file; // keep original File/Blob

        // Fuzzy match against products
        let bestMatch = null;
        let bestScore = 1;
        if (products.length > 0 && fuse) {
          const results = fuse.search(nameFromFile);
          if (results.length > 0 && results[0].score < 0.45) {
            bestMatch = results[0].item;
            bestScore = results[0].score;
          }
        }

        // Also try simple includes
        if (!bestMatch) {
          const cleaned = cleanName(nameFromFile);
          for (const p of products) {
            const pClean = cleanName(p.name);
            if (pClean && (cleaned.includes(pClean) || pClean.includes(cleaned))) {
              bestMatch = p;
              bestScore = 0.2;
              break;
            }
          }
        }

        const labelData = {
          filename: file.name,
          nameFromFile,
          blob,
          matchedProductName: bestMatch ? bestMatch.name : null,
          matchedScore: bestMatch ? bestScore : null
        };

        labels[id] = labelData;
        await saveLabel(id, {
          filename: file.name,
          nameFromFile,
          blob,
          matchedProductName: labelData.matchedProductName
        });

        if (bestMatch) {
          // Link product to this label
          const prod = products.find(p => p.id === bestMatch.id);
          if (prod) {
            prod.labelId = id;
            matchedCount++;
          }
          preview.push({
            file: nameFromFile,
            product: bestMatch.name,
            score: Math.round((1 - bestScore) * 100)
          });
        } else {
          preview.push({
            file: nameFromFile,
            product: '（未配對）',
            score: 0
          });
        }
        added++;
      }

      await saveProducts(products);
      updateStats();

      // Show preview
      const previewEl = document.getElementById('matchPreview');
      if (preview.length > 0) {
        previewEl.style.display = 'block';
        previewEl.innerHTML = preview.map(p => `
          <div class="match-item">
            <div>
              <strong>${escapeHtml(p.file)}</strong><br>
              <span style="color:#64748b">→ ${escapeHtml(p.product)}</span>
            </div>
            ${p.score > 0 ? `<span class="score">${p.score}%</span>` : '<span style="color:#94a3b8">未配對</span>'}
          </div>
        `).join('');
      }

      showStatus('pdfStatus', `已新增 ${added} 個 PDF，成功配對 ${matchedCount} 個`);
      toast(`已處理 ${added} 個標籤`);
      e.target.value = '';
    });

    async function rematchLabels() {
      // After new Excel, try to re-link existing labels
      for (const [id, label] of Object.entries(labels)) {
        if (!label.nameFromFile) continue;
        let bestMatch = null;
        let bestScore = 1;
        if (fuse) {
          const results = fuse.search(label.nameFromFile);
          if (results.length > 0 && results[0].score < 0.45) {
            bestMatch = results[0].item;
            bestScore = results[0].score;
          }
        }
        if (!bestMatch) {
          const cleaned = cleanName(label.nameFromFile);
          for (const p of products) {
            const pClean = cleanName(p.name);
            if (pClean && (cleaned.includes(pClean) || pClean.includes(cleaned))) {
              bestMatch = p;
              break;
            }
          }
        }
        if (bestMatch) {
          const prod = products.find(p => p.id === bestMatch.id);
          if (prod) prod.labelId = id;
          label.matchedProductName = bestMatch.name;
        }
      }
    }

    function escapeHtml(str) {
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    // ========== Search ==========
    function doSearch(query) {
      const q = (query || '').trim();
      const resultsEl = document.getElementById('searchResults');

      if (!q) {
        resultsEl.innerHTML = '<div class="empty"><div class="icon">🔎</div>請輸入條碼或商品名稱</div>';
        return;
      }

      if (products.length === 0) {
        resultsEl.innerHTML = '<div class="empty"><div class="icon">📭</div>請先上傳 Excel 商品資料</div>';
        return;
      }

      // Exact barcode match first
      let results = products.filter(p =>
        p.barcode === q || p.barcode2 === q ||
        (p.barcode && p.barcode.includes(q)) ||
        (p.barcode2 && p.barcode2.includes(q))
      );

      // If no exact, use fuzzy
      if (results.length === 0 && fuse) {
        const fuseResults = fuse.search(q);
        results = fuseResults
          .filter(r => r.score < 0.5)
          .slice(0, 8)
          .map(r => r.item);
      }

      if (results.length === 0) {
        resultsEl.innerHTML = '<div class="empty"><div class="icon">😕</div>找不到符合的商品</div>';
        return;
      }

      resultsEl.innerHTML = results.map(p => {
        const hasLabel = p.labelId && labels[p.labelId];
        return `
          <div class="result-card">
            <div class="name">${escapeHtml(p.name)}</div>
            <div class="meta">
              ${p.barcode ? `<span>條碼：${escapeHtml(p.barcode)}</span>` : ''}
              ${p.barcode2 ? `<span>第二條碼：${escapeHtml(p.barcode2)}</span>` : ''}
              ${hasLabel ? `<span style="background:#d1fae5;color:#065f46">已有標籤</span>` : '<span style="background:#fee2e2;color:#991b1b">未配對標籤</span>'}
            </div>
            <div class="result-actions">
              ${hasLabel ? `
                <button class="btn btn-primary" onclick="shareLabel('${p.labelId}')">📤 分享到 WePrint</button>
                <button class="btn btn-outline" onclick="previewLabel('${p.labelId}')">👁 預覽</button>
              ` : `
                <button class="btn btn-outline" disabled style="opacity:0.5">尚無標籤 PDF</button>
              `}
            </div>
          </div>
        `;
      }).join('');
    }

    document.getElementById('searchBtn').addEventListener('click', () => {
      doSearch(document.getElementById('barcodeInput').value);
    });
    document.getElementById('barcodeInput').addEventListener('keydown', (e) => {
      if (e.key === 'Enter') doSearch(e.target.value);
    });

    // ========== Share / Preview ==========
    window.shareLabel = async function(labelId) {
      const label = labels[labelId];
      if (!label || !label.blob) {
        toast('找不到標籤檔案');
        return;
      }

      const file = new File([label.blob], label.filename, { type: 'application/pdf' });

      if (navigator.share && navigator.canShare && navigator.canShare({ files: [file] })) {
        try {
          await navigator.share({
            files: [file],
            title: label.nameFromFile,
            text: '營養標籤 - ' + label.nameFromFile
          });
          toast('已開啟分享選單');
        } catch (err) {
          if (err.name !== 'AbortError') {
            console.error(err);
            fallbackDownload(file);
          }
        }
      } else {
        fallbackDownload(file);
      }
    };

    function fallbackDownload(file) {
      const url = URL.createObjectURL(file);
      const a = document.createElement('a');
      a.href = url;
      a.download = file.name;
      a.click();
      URL.revokeObjectURL(url);
      toast('已下載 PDF，請手動開啟並分享到 WePrint');
    }

    window.previewLabel = function(labelId) {
      const label = labels[labelId];
      if (!label || !label.blob) return;
      const url = URL.createObjectURL(label.blob);
      window.open(url, '_blank');
      // Note: URL will be revoked when page unloads; for long sessions it's fine
    };

    // ========== Scanner ==========
    document.getElementById('scanBtn').addEventListener('click', async () => {
      const readerEl = document.getElementById('reader');
      if (isScanning) {
        await stopScanner();
        return;
      }

      readerEl.classList.add('show');
      document.getElementById('scanBtn').textContent = '⏹ 停止掃描';
      isScanning = true;

      html5QrCode = new Html5Qrcode('reader');
      const config = { fps: 10, qrbox: { width: 250, height: 120 }, aspectRatio: 1.5 };

      try {
        await html5QrCode.start(
          { facingMode: 'environment' },
          config,
          (decodedText) => {
            document.getElementById('barcodeInput').value = decodedText;
            doSearch(decodedText);
            stopScanner();
            toast('掃描成功：' + decodedText);
          },
          () => {} // ignore errors
        );
      } catch (err) {
        console.error(err);
        toast('無法開啟相機：' + (err.message || '請確認權限'));
        stopScanner();
      }
    });

    async function stopScanner() {
      if (html5QrCode && isScanning) {
        try {
          await html5QrCode.stop();
          html5QrCode.clear();
        } catch (e) {}
      }
      isScanning = false;
      document.getElementById('reader').classList.remove('show');
      document.getElementById('scanBtn').textContent = '📷 開啟相機掃描條碼';
    }

    // ========== Tabs ==========
    document.querySelectorAll('.tab').forEach(tab => {
      tab.addEventListener('click', () => {
        document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
        document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
        tab.classList.add('active');
        document.getElementById('panel-' + tab.dataset.tab).classList.add('active');
        if (tab.dataset.tab !== 'search') stopScanner();
      });
    });

    // ========== Clear ==========
    document.getElementById('clearDataBtn').addEventListener('click', async () => {
      if (!confirm('確定要清除所有本地商品與標籤資料嗎？此操作無法復原。')) return;
      await clearAllData();
      products = [];
      labels = {};
      fuse = null;
      updateStats();
      document.getElementById('excelStatus').classList.remove('show');
      document.getElementById('pdfStatus').classList.remove('show');
      document.getElementById('matchPreview').style.display = 'none';
      document.getElementById('searchResults').innerHTML = '';
      toast('已清除所有資料');
    });

    // ========== Init ==========
    (async function init() {
      try {
        products = await loadProducts();
        labels = await loadAllLabels();
        // Re-link labelIds
        for (const p of products) {
          if (p.labelId && !labels[p.labelId]) p.labelId = null;
        }
        // Also try match from labels side
        for (const [id, label] of Object.entries(labels)) {
          if (label.matchedProductName) {
            const p = products.find(pr => pr.name === label.matchedProductName);
            if (p) p.labelId = id;
          }
        }
        rebuildFuse();
        updateStats();
      } catch (err) {
        console.error('Init error', err);
      }
    })();

    // Service worker for PWA (basic)
    if ('serviceWorker' in navigator) {
      // We will add a simple SW later if needed
    }
  </script>
</body>
</html>
