<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="theme-color" content="#0f766e" />
  <title>商品標籤助手 · Label Finder</title>
  <link rel="manifest" href="manifest.json" />
  <script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/fuse.js@7.0.0/dist/fuse.min.js"></script>
  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
  <style>
    :root { --primary: #0f766e; --primary-dark: #0d5c56; --bg: #f0fdfa; --card: #ffffff; --text: #134e4a; --danger: #dc2626; --border: #99f6e4; --radius: 14px; --shadow: 0 4px 20px rgba(15, 118, 110, 0.12); }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang TC", "Microsoft JhengHei", sans-serif; background: var(--bg); color: var(--text); min-height: 100dvh; padding-bottom: 90px; line-height: 1.5; }
    header { background: linear-gradient(135deg, var(--primary), #0d9488); color: white; padding: 14px 18px 16px; position: sticky; top: 0; z-index: 50; box-shadow: var(--shadow); }
    header h1 { font-size: 1.2rem; font-weight: 700; }
    header p { font-size: 0.78rem; opacity: 0.85; margin-top: 2px; }
    .tabs { display: flex; background: white; border-bottom: 1px solid var(--border); position: sticky; top: 68px; z-index: 40; }
    .tab { flex: 1; text-align: center; padding: 12px 4px; font-size: 0.88rem; font-weight: 600; color: #64748b; background: none; border: none; border-bottom: 3px solid transparent; cursor: pointer; }
    .tab.active { color: var(--primary); border-bottom-color: var(--primary); background: #f0fdfa; }
    .panel { display: none; padding: 14px; max-width: 640px; margin: 0 auto; }
    .panel.active { display: block; }
    .card { background: var(--card); border-radius: var(--radius); padding: 16px; margin-bottom: 14px; box-shadow: var(--shadow); border: 1px solid var(--border); }
    .card h2 { font-size: 1rem; margin-bottom: 10px; display: flex; align-items: center; gap: 6px; }
    label.file-btn, .btn { display: flex; align-items: center; justify-content: center; gap: 6px; padding: 12px 14px; border-radius: 11px; font-weight: 600; font-size: 0.92rem; cursor: pointer; border: none; transition: all 0.15s; }
    label.file-btn, .btn-primary { background: var(--primary); color: white; width: 100%; }
    label.file-btn:active, .btn-primary:active { background: var(--primary-dark); }
    input[type="file"] { display: none; }
    .btn-outline { background: white; color: var(--primary); border: 2px solid var(--primary); }
    .btn-sm { padding: 8px 12px; font-size: 0.82rem; border-radius: 8px; }
    .btn-danger { background: #fef2f2; color: var(--danger); border: 1px solid #fecaca; }
    .status { margin-top: 10px; font-size: 0.84rem; padding: 9px 11px; border-radius: 9px; background: #ecfdf5; color: #065f46; display: none; }
    .status.show { display: block; }
    .status.error { background: #fee2e2; color: #991b1b; }
    .stats { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; margin-top: 10px; }
    .stat { background: #f0fdfa; border-radius: 10px; padding: 10px 6px; text-align: center; }
    .stat .num { font-size: 1.35rem; font-weight: 700; color: var(--primary); }
    .stat .label { font-size: 0.7rem; color: #64748b; margin-top: 1px; }
    .search-box { display: flex; gap: 8px; margin-bottom: 12px; }
    .search-box input { flex: 1; padding: 12px 14px; border: 2px solid var(--border); border-radius: 11px; font-size: 1rem; outline: none; background: white; }
    .search-box input:focus { border-color: var(--primary); }
    .btn-scan { background: #0d9488; color: white; width: 100%; margin-bottom: 10px; }
    #reader { width: 100%; max-width: 400px; margin: 0 auto 14px; border-radius: 12px; overflow: hidden; display: none; }
    #reader.show { display: block; }
    .result-card, .label-item { background: white; border-radius: var(--radius); padding: 14px; margin-bottom: 10px; border: 1px solid var(--border); box-shadow: var(--shadow); }
    .result-card .name, .label-item .fname { font-size: 1.05rem; font-weight: 700; margin-bottom: 4px; word-break: break-all; }
    .result-card .meta, .label-item .meta { font-size: 0.82rem; color: #64748b; margin-bottom: 10px; }
    .result-card .meta span, .label-item .meta span { display: inline-block; background: #f0fdfa; padding: 2px 7px; border-radius: 6px; margin: 2px 4px 2px 0; }
    .tag-ok { background: #d1fae5 !important; color: #065f46 !important; }
    .tag-no { background: #fee2e2 !important; color: #991b1b !important; }
    .result-actions, .label-actions { display: flex; gap: 8px; flex-wrap: wrap; }
    .result-actions .btn, .label-actions .btn { flex: 1; min-width: 110px; }
    .empty { text-align: center; padding: 36px 16px; color: #94a3b8; }
    .empty .icon { font-size: 2.6rem; margin-bottom: 10px; }
    .footer-note { text-align: center; font-size: 0.72rem; color: #94a3b8; padding: 16px; }
    #toast { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%) translateY(120px); background: #134e4a; color: white; padding: 12px 18px; border-radius: 12px; font-size: 0.88rem; z-index: 200; transition: transform 0.3s ease; max-width: 90%; text-align: center; }
    #toast.show { transform: translateX(-50%) translateY(0); }
    .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.45); z-index: 150; display: none; align-items: flex-end; justify-content: center; }
    .modal-overlay.show { display: flex; }
    .modal { background: white; width: 100%; max-width: 500px; max-height: 85dvh; border-radius: 18px 18px 0 0; padding: 18px; overflow-y: auto; animation: slideUp 0.25s ease; }
    @keyframes slideUp { from { transform: translateY(40px); opacity: 0.6; } to { transform: translateY(0); opacity: 1; } }
    .modal h3 { font-size: 1.1rem; margin-bottom: 6px; }
    .modal .sub { font-size: 0.85rem; color: #64748b; margin-bottom: 14px; }
    .modal-search { margin-bottom: 12px; }
    .modal-search input { width: 100%; padding: 12px 14px; border: 2px solid var(--border); border-radius: 10px; font-size: 1rem; outline: none; }
    .modal-search input:focus { border-color: var(--primary); }
    .product-pick { padding: 12px; border-bottom: 1px solid #e2e8f0; cursor: pointer; }
    .product-pick:active { background: #f0fdfa; }
    .product-pick .pn { font-weight: 600; }
    .product-pick .pb { font-size: 0.8rem; color: #64748b; margin-top: 2px; }
    .modal-close { margin-top: 12px; width: 100%; padding: 12px; border-radius: 10px; border: none; background: #f1f5f9; font-weight: 600; color: #475569; }
    .filter-row { display: flex; gap: 8px; margin-bottom: 12px; }
    .filter-btn { flex: 1; padding: 8px; border-radius: 8px; border: 1px solid var(--border); background: white; font-size: 0.82rem; font-weight: 600; color: #64748b; cursor: pointer; }
    .filter-btn.active { background: var(--primary); color: white; border-color: var(--primary); }
  </style>
</head>
<body>
  <header>
    <h1>🏷️ 商品標籤助手</h1>
    <p>上傳 → 配對 → 掃碼 → 分享到 WePrint</p>
  </header>
  <div class="tabs">
    <button class="tab active" data-tab="upload">上傳</button>
    <button class="tab" data-tab="match">配對管理</button>
    <button class="tab" data-tab="search">搜尋/掃碼</button>
  </div>
  <div id="panel-upload" class="panel active">
    <div class="card">
      <h2>📊 商品資料庫 (Excel)</h2>
      <p style="font-size:0.82rem;color:#64748b;margin-bottom:10px;">需包含「名稱」、「條碼」、「第二條碼」</p>
      <label class="file-btn">選擇 Excel 檔案<input type="file" id="excelInput" accept=".xlsx,.xls,.csv" /></label>
      <div id="excelStatus" class="status"></div>
    </div>
    <div class="card">
      <h2>📄 營養標籤 PDF</h2>
      <p style="font-size:0.82rem;color:#64748b;margin-bottom:10px;">一次可選多個，檔名含商品名稱會自動模糊比對</p>
      <label class="file-btn">選擇多個 PDF<input type="file" id="pdfInput" accept=".pdf" multiple /></label>
      <div id="pdfStatus" class="status"></div>
    </div>
    <div class="card">
      <h2>📈 目前資料</h2>
      <div class="stats">
        <div class="stat"><div class="num" id="statProducts">0</div><div class="label">商品</div></div>
        <div class="stat"><div class="num" id="statLabels">0</div><div class="label">標籤</div></div>
        <div class="stat"><div class="num" id="statMatched">0</div><div class="label">已配對</div></div>
      </div>
      <button class="btn btn-danger" style="width:100%;margin-top:12px;" id="clearDataBtn">清除所有本地資料</button>
    </div>
  </div>
  <div id="panel-match" class="panel">
    <div class="card">
      <h2>🔗 標籤配對管理</h2>
      <p style="font-size:0.82rem;color:#64748b;margin-bottom:10px;">自動配對失敗的可以用「手動配對」連結商品</p>
      <div class="filter-row">
        <button class="filter-btn active" data-filter="all">全部</button>
        <button class="filter-btn" data-filter="unmatched">未配對</button>
        <button class="filter-btn" data-filter="matched">已配對</button>
      </div>
      <div id="matchList"></div>
    </div>
  </div>
  <div id="panel-search" class="panel">
    <div class="card">
      <h2>🔍 搜尋商品</h2>
      <button class="btn btn-scan" id="scanBtn">📷 開啟相機掃描條碼</button>
      <div id="reader"></div>
      <div class="search-box">
        <input type="text" id="barcodeInput" placeholder="輸入條碼或商品名稱..." inputmode="search" />
        <button class="btn btn-primary" style="width:auto;padding:12px 16px;" id="searchBtn">搜尋</button>
      </div>
      <div id="searchResults"></div>
    </div>
  </div>
  <div class="footer-note">資料只存在本機瀏覽器 · 可加入主畫面當成 App</div>
  <div id="toast"></div>
  <div class="modal-overlay" id="matchModal">
    <div class="modal">
      <h3>手動配對</h3>
      <div class="sub" id="modalLabelName">選擇要連結的商品</div>
      <div class="modal-search"><input type="text" id="modalSearchInput" placeholder="搜尋商品名稱或條碼..." /></div>
      <div id="modalProductList" style="max-height:40dvh;overflow-y:auto;"></div>
      <button class="modal-close" id="modalCloseBtn">取消</button>
    </div>
  </div>
  <div class="modal-overlay" id="previewModal">
    <div class="modal" style="max-height:92dvh;padding:12px;">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;">
        <h3 style="font-size:1rem;margin:0;" id="previewTitle">標籤預覽</h3>
        <button id="previewCloseBtn" style="background:#f1f5f9;border:none;border-radius:8px;padding:8px 14px;font-weight:600;color:#475569;">關閉</button>
      </div>
      <div id="previewContainer" style="width:100%;height:70dvh;background:#f8fafc;border-radius:10px;overflow:hidden;">
        <iframe id="previewFrame" style="width:100%;height:100%;border:none;"></iframe>
      </div>
      <div style="display:flex;gap:8px;margin-top:12px;">
        <button class="btn btn-primary" style="flex:1;" id="previewShareBtn">📤 分享到 WePrint</button>
        <button class="btn btn-outline" style="flex:1;" id="previewDownloadBtn">下載</button>
      </div>
    </div>
  </div>
  <script>
    // Full app script will be restored - temporary minimal to avoid broken state
    document.body.innerHTML = '<div style="padding:40px 20px;text-align:center;font-family:sans-serif;"><h2>正在修復中...</h2><p>請稍後重新整理頁面。<br>如果持續看到此訊息，請告訴我。</p></div>';
  </script>
</body>
</html>
