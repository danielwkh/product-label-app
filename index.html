    .result-card .name,.label-item .fname{font-size:1.05rem;font-weight:700;margin-bottom:4px;word-break:break-word}.result-card .meta,.label-item .meta{font-size:.82rem;color:var(--muted);margin-bottom:10px}.meta span{display:inline-block;background:#f0fdfa;padding:2px 7px;border-radius:6px;margin:2px 4px 2px 0}.tag-ok{background:#d1fae5!important;color:#065f46!important}.tag-no{background:#fee2e2!important;color:#991b1b!important}.tag-warn{background:#fef3c7!important;color:#92400e!important}.result-actions,.label-actions{display:flex;gap:8px;flex-wrap:wrap}.result-actions .btn,.label-actions .btn{flex:1;min-width:110px}.empty{text-align:center;padding:36px 16px;color:#94a3b8}.empty .icon{font-size:2.6rem;margin-bottom:10px}.footer-note{text-align:center;font-size:.72rem;color:#94a3b8;padding:16px}

    .manage-toolbar{display:flex;gap:8px;align-items:center;margin-bottom:10px}.manage-search{display:flex;flex:1}.manage-search input{width:100%;font-size:.92rem;padding:10px 12px}.sort-select{border:2px solid var(--border);border-radius:10px;padding:9px 6px;background:#fff;color:var(--text);max-width:130px}.filter-row{display:flex;gap:6px;margin-bottom:12px;overflow-x:auto;padding-bottom:2px}.filter-btn{flex:1;min-width:74px;padding:9px 6px;border-radius:8px;border:1px solid var(--border);background:#fff;font-size:.8rem;font-weight:600;color:var(--muted);white-space:nowrap}.filter-btn.active{background:var(--primary);color:#fff;border-color:var(--primary)}.match-summary{font-size:.8rem;color:var(--muted);margin:-4px 0 12px}.score-note{font-size:.75rem;color:#92400e;margin:2px 0 8px}.bulk-panel{position:sticky;top:115px;z-index:20;background:#f7fffe;border:1px solid var(--border);border-radius:12px;padding:10px;margin:4px 0 12px;box-shadow:0 3px 12px rgba(15,118,110,.1)}.bulk-select-row{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:.84rem;color:var(--text);margin-bottom:8px}.bulk-select-row label{display:flex;align-items:center;gap:8px;font-weight:600}.bulk-select-row input,.match-check{width:20px;height:20px;accent-color:var(--primary)}.bulk-count{color:var(--primary);font-weight:700}.bulk-actions{display:grid;grid-template-columns:1fr 1fr;gap:8px}.bulk-actions .btn{min-height:40px;padding:9px 8px}.label-item{position:relative}.label-item.is-selected{border-color:var(--primary);box-shadow:0 0 0 2px rgba(15,118,110,.14),var(--shadow)}.label-top{display:flex;align-items:flex-start;gap:10px}.label-top .fname{flex:1}.label-check{padding-top:2px;flex:0 0 auto}.bulk-row{display:flex;justify-content:space-between;align-items:center;margin:4px 0 10px;font-size:.8rem;color:var(--muted)}
    .preview-modal{max-width:680px;padding:12px}.preview-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}.preview-head h3{font-size:1rem;margin:0;max-width:75%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.preview-stage{width:100%;height:min(68dvh,720px);background:#e2e8f0;border-radius:10px;overflow:auto;text-align:center;padding:12px}.preview-stage canvas{max-width:100%;height:auto;background:#fff;box-shadow:0 2px 8px rgba(0,0,0,.18)}.preview-loading{color:#64748b;padding:30px 8px}.preview-controls{display:flex;gap:8px;align-items:center;margin:9px 0}.preview-controls button{padding:7px 11px;border:1px solid var(--border);background:#fff;border-radius:8px}.preview-controls span{flex:1;text-align:center;font-size:.8rem;color:var(--muted)}.preview-actions{display:flex;gap:8px;margin-top:8px}.preview-actions .btn{flex:1}
    @media(max-width:390px){.sort-select{max-width:105px}.label-actions .btn{min-width:90px;padding-left:6px;padding-right:6px}}

<body>
<header><h1>🏷️ 商品標籤助手</h1><p>上傳 → 配對 → 掃碼 → 分享到 WePrint</p></header>
<div class="tabs"><button class="tab active" data-tab="upload">上傳</button><button class="tab" data-tab="match">配對管理</button><button class="tab" data-tab="search">搜尋/掃碼</button></div>
<div id="panel-upload" class="panel active">
  <div class="card"><h2>📊 商品資料庫 (Excel)</h2><p style="font-size:.82rem;color:#64748b;margin-bottom:10px">需包含「名稱」、「條碼」、「第二條碼」</p><label class="file-btn">選擇 Excel 檔案<input type="file" id="excelInput" accept=".xlsx,.xls,.csv"></label><div id="excelStatus" class="status"></div></div>
  <div class="card"><h2>📄 營養標籤 PDF</h2><p style="font-size:.82rem;color:#64748b;margin-bottom:10px">檔名會先清理格式、比對條碼，再用商品名稱多訊號配對</p><label class="file-btn">選擇多個 PDF<input type="file" id="pdfInput" accept=".pdf" multiple></label><div id="pdfStatus" class="status"></div></div>
  <div class="card"><h2>📈 目前資料</h2><div class="stats"><div class="stat"><div class="num" id="statProducts">0</div><div class="label">商品</div></div><div class="stat"><div class="num" id="statLabels">0</div><div class="label">標籤</div></div><div class="stat"><div class="num" id="statMatched">0</div><div class="label">已配對</div></div></div><button class="btn btn-danger" style="width:100%;margin-top:12px" id="clearDataBtn">清除所有本地資料</button></div>
</div>
<div id="panel-match" class="panel"><div class="card"><h2>🔗 標籤配對管理</h2><p style="font-size:.82rem;color:#64748b;margin-bottom:10px">先篩選，再勾選需要處理的項目。人工配對會被保留，批次解除才會解除人工鎖定。</p><div class="manage-toolbar"><div class="manage-search"><input id="matchSearchInput" placeholder="搜尋檔名或商品名稱"></div><select id="matchSort" class="sort-select"><option value="status">配對狀態</option><option value="name">名稱 A-Z</option><option value="newest">最新上傳</option></select></div><div class="filter-row"><button class="filter-btn active" data-filter="all">全部</button><button class="filter-btn" data-filter="unmatched">未配對</button><button class="filter-btn" data-filter="review">待確認</button><button class="filter-btn" data-filter="matched">已配對</button></div><div id="matchSummary" class="match-summary"></div><div class="bulk-panel"><div class="bulk-select-row"><label><input type="checkbox" id="selectVisibleBtn"> 選取目前顯示</label><span class="bulk-count" id="selectedCount">已選 0 項</span><button class="btn btn-outline btn-sm" id="clearSelectionBtn" style="width:auto">清除</button></div><div class="bulk-actions"><button class="btn btn-primary btn-sm" id="bulkRematchBtn">↻ 批次重新配對</button><button class="btn btn-danger btn-sm" id="bulkUnlinkBtn">解除所選配對</button></div></div><div id="matchList"></div></div></div>
<div id="panel-search" class="panel"><div class="card"><h2>🔍 搜尋商品</h2><button class="btn btn-scan" id="scanBtn">📷 開啟相機掃描條碼</button><div id="reader"></div><div class="search-box"><input type="text" id="barcodeInput" placeholder="輸入條碼尾 6 碼或商品名稱..." inputmode="search"><button class="btn btn-primary" style="width:auto;padding:12px 16px" id="searchBtn">搜尋</button></div><div id="searchResults"></div></div></div>
<div class="footer-note">資料只存在本機瀏覽器 · 可加入主畫面當成 App</div><div id="toast"></div>
<div class="modal-overlay" id="matchModal"><div class="modal"><h3>手動配對</h3><div class="sub" id="modalLabelName">選擇要連結的商品</div><div class="modal-search"><input type="text" id="modalSearchInput" placeholder="搜尋商品名稱或條碼..."></div><div id="modalProductList" style="max-height:42dvh;overflow-y:auto"></div><button class="modal-close" id="modalCloseBtn">取消</button></div></div>
<div class="modal-overlay" id="previewModal"><div class="modal preview-modal"><div class="preview-head"><h3 id="previewTitle">標籤預覽</h3><button id="previewCloseBtn" class="modal-close" style="width:auto;margin:0;padding:8px 14px">關閉</button></div><div id="previewStage" class="preview-stage"><div class="preview-loading">準備預覽中…</div></div><div class="preview-controls"><button id="prevPageBtn">上一頁</button><span id="pageInfo">第 1 頁</span><button id="nextPageBtn">下一頁</button></div><div class="preview-actions"><button class="btn btn-primary" id="previewShareBtn">📤 分享到 WePrint</button><button class="btn btn-outline" id="previewOpenBtn">在系統開啟</button><button class="btn btn-outline" id="previewDownloadBtn">下載</button></div></div></div>
<script>
  let products=[],labels={},fuse=null,matchFuse=null,html5QrCode=null,isScanning=false,currentMatchLabelId=null,matchFilter='all',matchQuery='',matchSort='status',selectedLabelIds=new Set();
  let currentPreviewUrl=null,currentPreviewLabelId=null,currentPdf=null,currentPage=1;
  const DB_NAME='ProductLabelDB',DB_VERSION=2;
  const $=id=>document.getElementById(id);
  function openDB(){return new Promise((resolve,reject)=>{const req=indexedDB.open(DB_NAME,DB_VERSION);req.onupgradeneeded=e=>{const db=e.target.result;if(!db.objectStoreNames.contains('products'))db.createObjectStore('products',{keyPath:'id',autoIncrement:true});if(!db.objectStoreNames.contains('labels'))db.createObjectStore('labels',{keyPath:'id'});};req.onsuccess=()=>resolve(req.result);req.onerror=()=>reject(req.error)})}
  async function saveProducts(list){const db=await openDB(),tx=db.transaction('products','readwrite'),s=tx.objectStore('products');s.clear();list.forEach(p=>s.put(p));return new Promise((res,rej)=>{tx.oncomplete=res;tx.onerror=()=>rej(tx.error)})}
  async function loadProducts(){const db=await openDB();return new Promise((res,rej)=>{const r=db.transaction('products','readonly').objectStore('products').getAll();r.onsuccess=()=>res(r.result||[]);r.onerror=()=>rej(r.error)})}
  async function saveLabel(id,data){const db=await openDB(),tx=db.transaction('labels','readwrite');tx.objectStore('labels').put({id,...data});return new Promise((res,rej)=>{tx.oncomplete=res;tx.onerror=()=>rej(tx.error)})}
  async function loadAllLabels(){const db=await openDB();return new Promise((res,rej)=>{const r=db.transaction('labels','readonly').objectStore('labels').getAll();r.onsuccess=()=>{const m={};(r.result||[]).forEach(x=>m[x.id]=x);res(m)};r.onerror=()=>rej(r.error)})}
  async function clearAllData(){const db=await openDB(),tx=db.transaction(['products','labels'],'readwrite');tx.objectStore('products').clear();tx.objectStore('labels').clear();return new Promise((res,rej)=>{tx.oncomplete=res;tx.onerror=()=>rej(tx.error)})}
  function toast(msg,duration=2500){const e=$('toast');e.textContent=msg;e.classList.add('show');setTimeout(()=>e.classList.remove('show'),duration)}
  function showStatus(id,msg,type=''){const e=$(id);e.textContent=msg;e.className='status show'+(type?' '+type:'')}
  function escapeHtml(s){return String(s??'').replace(/[&<>\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;','\\':'&#92;'}[c]))}
  function updateStats(){$('statProducts').textContent=products.length;$('statLabels').textContent=Object.keys(labels).length;$('statMatched').textContent=products.filter(p=>p.labelId&&labels[p.labelId]).length}
  const FILENAME_NOISE=/\b(copy|final|new|新版|標籤|營養標示|nutrition|label|商品|產品)\b/gi;
  function normalizeName(s){return String(s??'').normalize('NFKC').toLowerCase().replace(/\.pdf$/i,'').replace(/\.(xlsx?|csv)$/i,'').replace(FILENAME_NOISE,' ').replace(/[_\-—–|/]+/g,' ').replace(/[，。、「」『』【】［］]/g,' ').replace(/\s+/g,' ').trim()}
  function normalize(s){return normalizeName(s).replace(/[^\p{L}\p{N}\s]/gu,' ').replace(/\s+/g,' ').trim()}
  function compact(s){return normalizeName(s).replace(/[^\p{L}\p{N}]/gu,'')}
  function digits(s){return String(s??'').replace(/\D/g,'')}
  function barcodeTail6(s){const value=digits(s);return value.length>=6?value.slice(-6):value}
  function isBarcodeQuery(s){return /^\s*[\d\s-]+\s*$/.test(String(s??''))&&digits(s).length>=6}
  function barcodeMatchesTail(product,tail){return [product.barcode,product.barcode2].some(code=>{const value=digits(code);return value.length>=6&&value.endsWith(tail)})}
  function tokens(s){return normalizeName(s).split(/\s+/).filter(x=>x.length>=2)}
  function dice(a,b){if(!a||!b)return 0;if(a===b)return 1;const A=tokens(a).length>1?tokens(a):[...a];const B=tokens(b).length>1?tokens(b):[...b];if(A.length===1&&B.length===1){const x=A[0],y=B[0];if(x.length<2||y.length<2)return 0;const grams=new Set([...Array(x.length-1)].map((_,i)=>x.slice(i,i+2)));let hit=0;for(let i=0;i<y.length-1;i++)if(grams.has(y.slice(i,i+2)))hit++;return 2*hit/(x.length+y.length)}const sa=new Set(A),sb=new Set(B);return 2*[...sa].filter(x=>sb.has(x)).length/(sa.size+sb.size)}
  function tokenCoverage(fileName,productName){const fileText=compact(fileName),required=tokens(productName).map(compact).filter(x=>x.length>=2);if(!required.length)return 0;return required.filter(token=>fileText.includes(token)).length/required.length}
  function matchScore(fileName,p){const raw=normalizeName(fileName),fn=compact(fileName),pn=compact(p.name);let score=0,why=[],barcodeHit=false;if(!raw||!pn)return {score:0,why,barcodeHit};const fDigits=digits(fileName),codes=[p.barcode,p.barcode2].map(digits).filter(x=>x.length>=6);if(codes.some(c=>c&&fDigits.includes(c))){score+=1000;barcodeHit=true;why.push('檔名含條碼')}if(fn===pn){score+=500;why.push('名稱完全相同')}else if(fn.includes(pn)||pn.includes(fn)){score+=260;why.push('名稱互相包含')}const coverage=tokenCoverage(fileName,p.name);score+=coverage*180;if(coverage>=.8)why.push(`關鍵詞命中 ${Math.round(coverage*100)}%`);const d=dice(raw,p.name);score+=d*100;if(d>=.75)why.push('名稱高度相似');const lengthRatio=Math.min(raw.length,pn.length)/Math.max(raw.length,pn.length,1);score+=lengthRatio*35;return {score,why,barcodeHit,coverage}}
  function findBestMatch(fileName,excludeLabelId=null){const candidateMap=new Map(),fileDigits=digits(fileName);products.forEach(p=>{const linked=p.labelId&&p.labelId!==excludeLabelId?labels[p.labelId]:null;if(linked?.matchSource==='manual')return;const codes=[p.barcode,p.barcode2].map(digits).filter(x=>x.length>=6);if(codes.some(c=>fileDigits.includes(c)))candidateMap.set(p.id,p)});if(matchFuse)matchFuse.search(normalizeName(fileName)).slice(0,8).forEach(r=>{const p=products.find(x=>x.id===r.item.id);if(p)candidateMap.set(p.id,p)});if(!candidateMap.size)products.forEach(p=>{const linked=p.labelId&&p.labelId!==excludeLabelId?labels[p.labelId]:null;if(linked?.matchSource!=='manual')candidateMap.set(p.id,p)});const ranked=[...candidateMap.values()].map(product=>({product,...matchScore(fileName,product)})).sort((a,b)=>b.score-a.score);const best=ranked[0],second=ranked[1];if(!best)return null;const gap=best.score-(second?.score||0);const confidence=best.barcodeHit||best.score>=500||(best.score>=330&&gap>=70)?'high':best.score>=180&&gap>=30?'review':'low';return {...best,secondBest:second,gap,confidence}}
  function rebuildFuse(){fuse=products.length?new Fuse(products,{keys:[{name:'name',weight:.6},{name:'barcode',weight:.25},{name:'barcode2',weight:.25}],threshold:.45,ignoreLocation:true,includeScore:true}):null;matchFuse=products.length?new Fuse(products,{keys:[{name:'name',weight:.7},{name:'barcode',weight:.15},{name:'barcode2',weight:.15}],threshold:.55,ignoreLocation:true,includeScore:true,minMatchCharLength:2}):null}
  async function applyAutoMatch(label,force=false){if(!force&&label.matchSource==='manual')return null;const best=findBestMatch(label.nameFromFile,label.id);products.forEach(p=>{if(p.labelId===label.id)p.labelId=null});if(best&&best.confidence!=='low'){if(best.product.labelId&&best.product.labelId!==label.id){const old=labels[best.product.labelId];if(old&&old.matchSource!=='manual'){old.matchedProductName=null;old.matchSource=null;old.matchScore=null;old.matchConfidence=null;await saveLabel(old.id,old)}}best.product.labelId=label.id;label.matchedProductName=best.product.name;label.matchSource='auto';label.matchScore=Math.round(best.score);label.matchConfidence=best.confidence;label.matchGap=Math.round(best.gap);label.matchWhy=best.why.join('、');await saveLabel(label.id,label)}else{label.matchedProductName=null;label.matchSource=null;label.matchScore=null;label.matchConfidence='low';label.matchGap=null;label.matchWhy=null;await saveLabel(label.id,label)}return best}
  function getLabelProduct(label){return products.find(p=>p.labelId===label.id)||products.find(p=>p.name===label.matchedProductName)}
  function renderMatchList(){const el=$('matchList'),all=Object.entries(labels).map(([id,l])=>({id,...l,product:getLabelProduct({id,...l})}));let list=all.filter(l=>matchFilter==='all'||(matchFilter==='matched'?l.matchedProductName:matchFilter==='review'?l.matchConfidence==='review':!l.matchedProductName)).filter(l=>{if(!matchQuery)return true;const q=normalize(matchQuery);return normalize(l.nameFromFile+' '+(l.matchedProductName||'')).includes(q)});list.sort((a,b)=>matchSort==='name'?normalize(a.nameFromFile).localeCompare(normalize(b.nameFromFile),'zh-Hant'):matchSort==='newest'?String(b.uploadedAt||'').localeCompare(String(a.uploadedAt||'')):Number(!a.matchedProductName)-Number(!b.matchedProductName));const visibleIds=new Set(list.map(l=>l.id));selectedLabelIds.forEach(id=>{if(!visibleIds.has(id))selectedLabelIds.delete(id)});$('matchSummary').textContent=`顯示 ${list.length} / ${all.length} 個標籤 · 已配對 ${all.filter(x=>x.matchedProductName).length} · 待確認 ${all.filter(x=>x.matchConfidence==='review').length} · 未配對 ${all.filter(x=>!x.matchedProductName).length}`;if(!list.length){el.innerHTML='<div class="empty"><div class="icon">📄</div>沒有符合條件的項目</div>';updateSelectionUI([]);return}el.innerHTML=list.map(l=>{const linked=l.matchedProductName,manual=l.matchSource==='manual',selected=selectedLabelIds.has(l.id);return `<div class="label-item${selected?' is-selected':''}"><div class="label-top"><label class="label-check" aria-label="選取此標籤"><input class="match-check" type="checkbox" data-label-id="${l.id}" ${selected?'checked':''} onchange="toggleLabelSelection('${l.id}',this.checked)"></label><div class="fname">${escapeHtml(l.nameFromFile||l.filename)}</div></div><div class="meta">${linked?`<span class="tag-ok">已配對：${escapeHtml(linked)}</span>`:'<span class="tag-no">未配對</span>'}${manual?'<span class="tag-warn">人工鎖定</span>':''}${l.matchConfidence==='review'?'<span class="tag-warn">待確認</span>':''}${l.matchScore&&!manual?`<span>信心 ${l.matchScore}${l.matchGap!=null?' · 差距 '+l.ma   function findCol(headers,cands){return headers.find(h=>cands.some(c=>normalize(h).includes(normalize(c))||normalize(c).includes(normalize(h))))}
  $('excelInput').addEventListener('change',async e=>{const file=e.target.files[0];if(!file)return;showStatus('excelStatus','讀取中…');try{const wb=XLSX.read(await file.arrayBuffer(),{type:'array'}),rows=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{defval:''});if(!rows.length)throw Error('Excel 沒有資料');const headers=Object.keys(rows[0]),nameCol=findCol(headers,['名稱','商品名稱','品名','name','product']),barcodeCol=findCol(headers,['條碼','barcode','bar code','主條碼']),barcode2Col=findCol(headers,['第二條碼','副條碼','barcode2','second','barcode 2']);if(!nameCol)throw Error('找不到「名稱」欄位');const oldByName=new Map(products.map(p=>[normalize(p.name),p]));products=rows.map((r,i)=>{const old=oldByName.get(normalize(String(r[nameCol]||'')));return {id:i+1,name:String(r[nameCol]||'').trim(),barcode:String(r[barcodeCol]||'').trim(),barcode2:String(r[barcode2Col]||'').trim(),labelId:old?.labelId||null}}).filter(p=>p.name);rebuildFuse();for(const l of Object.values(labels))await applyAutoMatch(l);await saveProducts(products);updateStats();renderMatchList();showStatus('excelStatus',`成功載入 ${products.length} 個商品；人工配對會保留`);toast('Excel 上傳成功')}catch(err){showStatus('excelStatus','讀取失敗：'+err.message,'error')}e.target.value=''})

  function doSearch(query){const q=String(query||'').trim(),el=$('searchResults');if(!q){el.innerHTML='<div class="empty"><div class="icon">🔎</div>請輸入尾 6 碼或商品名稱</div>';return}if(!products.length){el.innerHTML='<div class="empty"><div class="icon">📭</div>請先上傳 Excel</div>';return}const barcodeQuery=isBarcodeQuery(q),tail=barcodeQuery?barcodeTail6(q):'',results=barcodeQuery?products.filter(p=>barcodeMatchesTail(p,tail)):(fuse?fuse.search(q).filter(r=>r.score<.55).slice(0,10).map(r=>r.item):products.filter(p=>normalize(p.name).includes(normalize(q))));if(!results.length){el.innerHTML=`<div class="empty"><div class="icon">😕</div>${barcodeQuery?`找不到條碼尾 6 碼「${escapeHtml(tail)}」的商品`:'找不到符合的商品'}</div>`;return}el.innerHTML=results.map(p=>{const has=p.labelId&&labels[p.labelId],tailCodes=[p.barcode,p.barcode2].map(barcodeTail6).filter((code,i,a)=>code&&a.indexOf(code)===i);return `<div class="result-card"><div class="name">${escapeHtml(p.name)}</div><div class="meta">${tailCodes.length?`<span>條碼尾 6 碼：${escapeHtml(tailCodes.join(' / '))}</span>`:''}${has?'<span class="tag-ok">已有標籤</span>':'<span class="tag-no">未配對標籤</span>'}</div><div class="result-actions">${has?`<button class="btn btn-primary" onclick="shareLabel('${p.labelId}')">📤 分享到 WePrint</button><button class="btn btn-outline" onclick="previewLabel('${p.labelId}')">👁 預覽</button>`:'<button class="btn btn-outline" disabled>尚無標籤</button>'}</div></div>`}).join('')}
